<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YXT GAMING</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

        }

        h1 {
            color: darkblue;
            font-size: 42px;
            margin-top: 35px;
        }

        .menu {
            margin: 25px 0;
        }

        .menu a {
            display: inline-block;
            background: white;
            color: darkblue;
            text-decoration: none;
            padding: 15px 25px;
            margin: 5px;
            border-radius: 10px;
            font-size: 20px;
        }

        .box {
            background: white;
            width: 80%;
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
        }

        .box h2 {
            color: darkblue;
        }

        .box p {
            color: green;
            font-size: 20px;
        }

        .my-photo {
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .about-button {
            display: inline-block;
            background: darkblue;
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 20px;
            margin-top: 20px;
        }

<body>

    <h1>YXT GAMING</h1>

    <div class="menu">
        <a href="index.html">Home</a>

    <div class="box">

        <p>Welcome to my website!</p>

        <!-- আপনার ছবির নাম এখানে দিতে হবে -->

        <br>

        <a href="about.html" class="about-button">
